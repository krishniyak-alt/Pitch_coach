services:
  - type: web
    name: pitchcoach-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn pitch_backend.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
